name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar que Pages publica desde el workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          response="$(curl --silent --show-error --write-out $'\n%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages" || true)"
          code="$(printf '%s' "$response" | tail -n1)"
          body="$(printf '%s' "$response" | sed '$d')"

          # Solo se bloquea cuando se lee un origen distinto de "workflow". Si la
          # consulta no se puede hacer, se avisa y se sigue: no tiene sentido
          # frenar una publicación válida por no poder comprobar el ajuste.
          if [ "$code" != "200" ]; then
            echo "::warning::No se pudo consultar el origen de GitHub Pages (HTTP ${code}). Se continúa sin esta comprobación."
            exit 0
          fi

          build_type="$(printf '%s' "$body" | sed -n 's/.*"build_type"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          echo "Origen de GitHub Pages: ${build_type:-desconocido}"
          if [ -n "$build_type" ] && [ "$build_type" != "workflow" ]; then
            echo "::error::Pages está configurado como '${build_type}'. Con ese ajuste GitHub ejecuta además su constructor heredado, que publica la rama tal cual y sobrescribe este artifact: el sitio queda sin <base>, sin las páginas de cada ruta, sin sitemap.xml ni robots.txt. Cámbialo en Settings → Pages → Source: GitHub Actions y vuelve a lanzar este flujo."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Verify production output
        run: npm run test:production
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published site
        shell: bash
        run: |
          set -euo pipefail
          site_url="${{ steps.deployment.outputs.page_url }}"
          site_url="${site_url%/}"

          # Cada recurso debe existir: una ruta profunda, el sitemap o robots que
          # falten significan que se publicó un artefacto incompleto o antiguo.
          for path in "" src/main.js src/fonts.css robots.txt sitemap.xml \
                      public/og.png public/site.webmanifest public/icons/icon-512.png \
                      proyectos/ proyectos/portfolio/ cv/ contacto/; do
            echo "Comprobando ${site_url}/${path}"
            curl --fail --silent --show-error --location \
                 --retry 6 --retry-delay 5 --retry-all-errors \
                 --output /dev/null "${site_url}/${path}"
          done

          # El contenido servido tiene que ser el de esta compilación, no uno anterior.
          home="$(curl --fail --silent --location --retry 6 --retry-delay 5 --retry-all-errors "${site_url}/")"
          if ! printf '%s' "$home" | grep -q '<base href="/Portafolio/"'; then
            echo "El sitio publicado no declara la subruta esperada."; exit 1
          fi
          if printf '%s' "$home" | grep -q 'fonts.googleapis.com'; then
            echo "El sitio publicado aún pide tipografías a Google."; exit 1
          fi
          echo "Sitio publicado y verificado en ${site_url}/"
