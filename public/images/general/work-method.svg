<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">Método de trabajo</title><desc id="desc">Secuencia de análisis desde el contexto hasta la mejora continua.</desc>
<style>text{font-family:Arial,sans-serif}.k{font-size:14px;letter-spacing:2px;fill:#c9d8ea}.t{font-size:21px;font-weight:700;fill:#f1f6fc}.s{font-size:14px;fill:#c9d8ea}.n{fill:#335879;stroke:#9ac2eb;stroke-width:2}.l{stroke:#9ac2eb;stroke-width:2}.b{fill:#eef6ff}.bt{font-size:13px;font-weight:bold;fill:#203b53}</style>
<rect width="1200" height="500" fill="#294667"/><path d="M0 84H1200M0 184H1200M0 284H1200M0 384H1200M100 0V500M300 0V500M500 0V500M700 0V500M900 0V500M1100 0V500" stroke="#5a7da4" opacity=".4"/>
<text x="55" y="60" class="k">FORMA DE TRABAJO · DE LA NECESIDAD A LA OPERACIÓN</text>
<path class="l" d="M240 270H300M470 270H530M700 270H760M930 270H990"/><path d="m289 261 16 9-16 9m169-18 16 9-16 9m169-18 16 9-16 9m169-18 16 9-16 9" fill="none" stroke="#eef6ff" stroke-width="2"/>
<g transform="translate(55 190)"><rect class="n" width="185" height="160" rx="9"/><circle class="b" cx="30" cy="31" r="14"/><text x="25" y="36" class="bt">1</text><text x="30" y="85" class="t">Contexto</text><text x="30" y="113" class="s">Entender antes</text><text x="30" y="135" class="s">de construir.</text></g>
<g transform="translate(300 190)"><rect class="n" width="170" height="160" rx="9"/><circle class="b" cx="30" cy="31" r="14"/><text x="25" y="36" class="bt">2</text><text x="30" y="85" class="t">Reglas</text><text x="30" y="113" class="s">Modelar decisiones</text><text x="30" y="135" class="s">y excepciones.</text></g>
<g transform="translate(530 190)"><rect class="n" width="170" height="160" rx="9"/><circle class="b" cx="30" cy="31" r="14"/><text x="25" y="36" class="bt">3</text><text x="30" y="85" class="t">Datos</text><text x="30" y="113" class="s">Definir información</text><text x="30" y="135" class="s">confiable.</text></g>
<g transform="translate(760 190)"><rect class="n" width="170" height="160" rx="9"/><circle class="b" cx="30" cy="31" r="14"/><text x="25" y="36" class="bt">4</text><text x="30" y="85" class="t">Interfaz</text><text x="30" y="113" class="s">Reducir fricción</text><text x="30" y="135" class="s">operativa.</text></g>
<g transform="translate(990 190)"><rect class="n" width="155" height="160" rx="9"/><circle class="b" cx="30" cy="31" r="14"/><text x="25" y="36" class="bt">5</text><text x="30" y="85" class="t">Mejora</text><text x="30" y="113" class="s">Probar, aprender</text><text x="30" y="135" class="s">e iterar.</text></g>
</svg>
