<!doctype html>
<html lang="es" data-site-base="/">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#101514">
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="La página solicitada no existe en el portfolio de Jonas Martínez.">
    <!-- El script y el estilo van por hash, no por 'unsafe-inline'. scripts/verify.mjs
         recalcula ambos hashes y falla si el contenido cambia sin actualizarlos. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'sha256-OS3EG3MaguYzKKfCFD3GoLjm+pBbqJqKDqtKp4ZmRWk='; script-src 'self' 'sha256-T+89LJEQDyiHGFR3V7DgIbRUJn3IOTysaXGee+9vjFg='; connect-src 'self'">
    <title>404 | Jonas Martínez</title>
    <script>
      (() => {
        try {
          // data-site-base lo reescribe scripts/build-static.mjs con la subruta real.
          const base = document.documentElement.dataset.siteBase || '/';
          addEventListener('DOMContentLoaded', () => {
            const home = document.querySelector('a[data-home]');
            if (home) home.setAttribute('href', base);
          });
          const requested = `${location.pathname}${location.search}${location.hash}`;
          if (requested.startsWith(base) && requested !== base) {
            sessionStorage.setItem('portfolio-redirect', requested);
            location.replace(base);
          }
        } catch {}
      })();
    </script>
    <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5ef;color:#101514;font:16px/1.5 Arial,sans-serif}main{max-width:620px;padding:40px}h1{font-size:clamp(48px,10vw,96px);line-height:.9;margin:0 0 18px}a{display:inline-block;margin-top:20px;padding:11px 15px;background:#101514;color:#f5f5ef;text-decoration:none;font-weight:bold}</style>
  </head>
  <body>
    <main>
      <p>ERROR 404</p>
      <h1>Esta ruta no forma parte del sistema.</h1>
      <p>La dirección puede haber cambiado o no existir. Puedes volver al inicio y continuar navegando.</p>
      <a data-home href="/">Volver al inicio</a>
    </main>
    <script src="/src/log-404.js" defer></script>
  </body>
</html>
